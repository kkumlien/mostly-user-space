base_url = "https://kkumlien.github.io/mostly-user-space"
title = "Mostly User Space"
description = "A tech blog by Kamal Kumlien"
default_language = "en"
author = "Kamal Kumlien"

compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[slugify]
# Keep the date prefix of post filenames in the URL: /YYYY-MM-DD-slug/
paths_keep_dates = true

[markdown]
insert_anchor_links = "right"
external_links_target_blank = false

[markdown.highlighting]
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
# Header tagline; the author's name links to author_url.
tagline = "A tech blog by"
author_url = "https://github.com/kkumlien"
source_url = "https://github.com/kkumlien/mostly-user-space"
