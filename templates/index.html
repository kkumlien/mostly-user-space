{% extends "base.html" %}

{% block content %}
<ul class="post-list">
  {% for page in section.pages %}
  <li>
    <time datetime="{{ page.date }}">{{ page.date | date(format="%-d %b %Y") }}</time>
    <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endblock content %}
